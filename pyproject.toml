[project]
name = "clause-and-effect"
version = "0.1.0"
description = "Where Regulations Meet AI Reasoning"
readme = "README.md"
authors = [
    { name = "Bertan Günyel", email = "bertan.gunyel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ai-common @ git+https://github.com/bgunyel/ai-common.git@main",
    "docling>=2.68.0",
    # A docling dependency, declared because the parsers now import
    # DoclingDocument directly rather than only through docling's converter.
    "docling-core>=2.87.1",
    "openvino>=2025.4.1",
    "pydantic-settings>=2.12.0",
    "qdrant-client>=1.16.2",
    "rich>=14.2.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[tool.uv]
# Pin the resolver, not only its output. uv writes uv.lock, and uv.lock is the
# artifact both gate tiers read — osv-scanner parses it, and the GuardDog sweep
# scans whatever `uv export` flattens out of it. uv's 0.x scheme puts breaking
# changes at minor bumps, so patch releases flow freely while 0.13 has to be a
# deliberate decision rather than an arrival.
required-version = ">=0.12,<0.13"

[tool.pytest.ini_options]
# Repo root on sys.path so tests can `import src...` the same way the app does.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
