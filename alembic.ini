# Alembic's command-line configuration. Decision 3 — migrations from the first
# commit, because a remote database means a schema change is no longer "delete
# the file".
#
#   uv run --group migrations alembic upgrade head          # apply
#   uv run --group migrations alembic upgrade head --sql    # print, apply nothing
#   uv run --group migrations alembic revision --autogenerate -m "..."
#
# Three things this file deliberately does NOT contain, each of which the file
# `alembic init` writes does contain.
#
# **No `sqlalchemy.url`.** The URL is `DB_URL`, it holds a password, and this
# file is committed. `migrations/env.py` reads it from the environment through
# `src.db.engine`, which is also the only place that knows which driver to
# rewrite it onto. A URL here would be both a leaked secret and a second answer
# to a question that already has one.
#
# **No `[loggers]`/`[handlers]`/`[formatters]` sections**, and `env.py` does not
# call `fileConfig`. Logging in this repository is configured in exactly one
# place, `src/logging_setup.py`, and an ini file that installs its own handlers
# is a second place with different formatting. `env.py` calls `setup_logging()`
# the way every other entry point does.
#
# **No `version_locations`.** One directory, one branch; the multi-root support
# exists for projects merging migration streams from separate packages.

[alembic]
script_location = migrations

# So `import src...` inside env.py resolves when alembic is invoked from the
# repository root. Alembic runs env.py as a file rather than importing it, so it
# gets no package context of its own.
prepend_sys_path = .

# Date first, so `ls versions/` is chronological order and the revision hash —
# which sorts arbitrarily — is not what a reader has to scan. The `%%` is
# configparser escaping, not a typo.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

version_path_separator = os